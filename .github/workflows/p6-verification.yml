name: P6 Customer QR Ordering Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_retail_bi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hybrid_retail_bi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Apply local migrations through current head
        working-directory: backend
        env:
          DEPLOYMENT_MODE: local_hub
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          LOCAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          SECRET_KEY: github-actions-p6-only
        run: alembic -c alembic.ini upgrade head
      - name: Verify P6 remains in local history and cloud history stays separate
        working-directory: backend
        run: |
          alembic -c alembic.ini history | grep -q "20260813_0013"
          alembic -c alembic_cloud.ini history | grep -q "20260813_cloud_0001"
          test "$(alembic -c alembic.ini heads | awk '{print $1}')" != "$(alembic -c alembic_cloud.ini heads | awk '{print $1}')"
      - name: Run P6 release-blocking tests
        working-directory: backend
        run: >-
          python -m pytest -q --disable-warnings
          tests/test_public_qr_orders.py
          tests/test_public_qr_authorization.py
          tests/test_order_idempotency.py
          tests/test_public_rate_limits.py
          tests/test_cafe_qr_security.py
          tests/test_table_sessions.py
          tests/test_cross_venture_isolation.py
          tests/test_company_scope_auth.py
          tests/test_inventory.py
          tests/test_invoices.py
          tests/test_sync_foundation.py
          tests/test_deployment_modes.py
      - name: Run complete backend regression
        working-directory: backend
        run: python -m pytest -q --disable-warnings
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app server.py scripts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify public ordering boundary
        run: |
          grep -q 'window.location.pathname.startsWith("/order/")' frontend/src/main.tsx
          grep -q 'Idempotency-Key' frontend/src/api/publicCafeClient.ts
          grep -q '7000' frontend/src/public/useCafeSession.ts
          ! grep -R -q 'dangerouslySetInnerHTML' frontend/src/public
          ! grep -R -q 'localStorage' frontend/src/public frontend/src/api/publicCafeSession.ts
      - name: Verify authenticated portal boundaries
        working-directory: frontend
        run: node scripts/verify-portals.mjs
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_OPERATIONAL_API_BASE_URL: https://ops-api.example.invalid/api
        run: npm run build
