name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app server.py

      - name: Verify migration heads
        run: |
          alembic -c alembic.ini heads
          alembic -c alembic_cloud.ini heads

      - name: Run deployment boundary tests
        run: python -m pytest -q --disable-warnings tests/test_deployment_modes.py

      - name: Run HC1 synchronization tests
        run: python -m pytest -q --disable-warnings tests/test_sync_foundation.py

      - name: Run full backend regression
        run: python -m pytest -q --disable-warnings
