name: HC3 Cloud Order Convergence Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_retail_bi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hybrid_retail_bi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Create isolated cloud coordination database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c "CREATE DATABASE hybrid_cloud_coordination;"
      - name: Apply Local Hub migrations through current head
        working-directory: backend
        env:
          DEPLOYMENT_MODE: local_hub
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          LOCAL_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_retail_bi
          SECRET_KEY: github-actions-hc3-only
        run: alembic -c alembic.ini upgrade head
      - name: Apply independent cloud coordination migrations
        working-directory: backend
        env:
          CLOUD_RUNTIME_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_cloud_coordination
          CLOUD_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_cloud_coordination
        run: alembic -c alembic_cloud.ini upgrade head
      - name: Verify HC3 remains in local and cloud histories stay independent
        working-directory: backend
        run: |
          alembic -c alembic.ini history | grep -q "20260814_0014"
          alembic -c alembic_cloud.ini history | grep -q "20260813_cloud_0001"
          test "$(alembic -c alembic.ini heads | awk '{print $1}')" != "$(alembic -c alembic_cloud.ini heads | awk '{print $1}')"
      - name: Run HC3 release-blocking convergence tests
        working-directory: backend
        env:
          HC3_TEST_CLOUD_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_cloud_coordination
          HC2_TEST_CLOUD_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_cloud_coordination
        run: >-
          python -m pytest -q --disable-warnings
          tests/test_hc3_cloud_order_convergence.py
          tests/test_hc3_worker_restart.py
          tests/test_hc3_sync_status.py
          tests/test_sync_transaction_boundary.py
          tests/test_sync_foundation.py
          tests/test_public_qr_orders.py
          tests/test_public_qr_authorization.py
          tests/test_order_idempotency.py
          tests/test_cafe_qr_security.py
          tests/test_table_sessions.py
          tests/test_cross_venture_isolation.py
          tests/test_company_scope_auth.py
          tests/test_deployment_modes.py
          tests/test_hc2_cloud_gateway.py
      - name: Run complete backend regression
        working-directory: backend
        env:
          HC3_TEST_CLOUD_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_cloud_coordination
          HC2_TEST_CLOUD_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hybrid_cloud_coordination
        run: python -m pytest -q --disable-warnings
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app server.py scripts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify browser contains no server-only cloud credentials
        run: >-
          ! grep -R -E
          'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|CLOUD_RUNTIME_DATABASE_URL|CLOUD_MIGRATION_DATABASE_URL|SYNC_DEVICE_SECRET'
          frontend/src frontend/.env.example
      - name: Verify portal and public ordering boundaries
        working-directory: frontend
        run: |
          node scripts/verify-portals.mjs
          grep -q 'window.location.pathname.startsWith("/order/")' src/main.tsx
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_CLOUD_API_BASE_URL: https://cloud-api.example.invalid/api
          VITE_OPERATIONAL_API_BASE_URL: https://ops-api.example.invalid/api
        run: npm run build
