name: P3 Ready Gate

on:
  workflow_run:
    workflows: ["P3 Portal And Venture User Verification"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Mark only the verified latest PR head ready
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA="$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} --jq .head.sha)"
          if [ "${CURRENT_SHA}" != "${VERIFIED_SHA}" ]; then
            echo "Verified run is stale: ${VERIFIED_SHA}; current PR head is ${CURRENT_SHA}."
            exit 1
          fi
          gh pr ready "${PR_NUMBER}" --repo "${{ github.repository }}"
